<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trellor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img class="logo" src="" alt="">
        <h1>Trello</h1>
        <div class="div-header">
            <img class="icono-person" src="./images/person-circle.svg" alt="">
            <ul>
                <li></li>
                <li></li>
            </ul>
        </div>
    </header>
    <main>
        <div>
            <form>
                <h2>Iniciar Sesion</h2>
                <label for="email">
                    <span>correo</span>
                    <input type="email" id="email" required>
                </label>
                <label for="password">
                    <span>contraseña</span>
                    <input id="password" type="password">
                </label>
                <button type="submit" id="button">Iniciar Sesion</button>
                <label for="button">
                    <span>error</span>
                </label>
            </form>
            <form>
                <h2>Registrarse</h2>
                <label for="nombre">
                    <span>Nombre</span>
                    <input id="nombre" type="text" required>
                </label>
                <label for="apellido">
                    <span>Apellido</span>
                    <input id="apellido" type="text" required>
                </label>
                <label for="edad">
                    <span>Edad</span>
                    <input id="edad" type="number" required>
                </label>
                <label for="correo">
                    <span>Email</span>
                    <input id="correo" type="email" required>
                </label>
                <label for="contraseña">
                    <span>Contraseña</span>
                    <input id="contraseña" type="password" required>
                </label>
                <label for="confirmar-contraseña">
                    <span>Comfirmar Contraseña</span>
                    <input id="Comfirmar Contraseña" type="password" required>
                </label>
            </form>
            <form></form>
        </div>
    </main>
</body>
</html>
