<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trello</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="header-left">
            <img src="" alt="logo">
        <h1>Trello</h1>
        </a>
        <div class="header-right">
            <img src="" alt="foto de Perfil">
            <ul>
                <li>configiracion</li>
                <li>salir</li>
            </ul>
        </div>
    </header>
    <main>
        <div id="cont-regis" class="cont-regis">
            <section id="sect-login">
                <h2>Iniciar Sesion</h2>
                <form>
                    <label>
                        <span>Correo</span>
                        <input type="email" name="correo" id="inputEmail" required>
                    </label>
                    <label>
                        <span>Contraseña</span>
                        <input id="inputPass" type="password" required>
                    </label>
                    <button>Iniciar Sesion</button>
                </form>
                <p class="error-p"></p>
                <a href="#" id="linkToSignIn">no tengo cuenta</a>
            </section>

            <!-- segundo form -->
            <section id="sect-regis">
                <h2>Registrarse</h2>
                <form>
                    <label>
                        <span>Nombre</span>
                        <input type="text" name="nombre" id="inputName" required minlength="3" maxlength="20">
                    </label>

                    <label>
                        <span>Apellido</span>
                        <input type="text" name="apellido" id="lastName" required minlength="3" maxlength="20">
                    </label>


                    <label>
                        <span>Edad</span>
                        <input type="number" name="edad" id="inputAge" required min="10">
                    </label>

                    <label>
                        <span>Email</span>
                        <input type="email" name="correo" id="inputReEmail" required>
                    </label>

                    <label>
                        <span>Contraseña</span>
                        <input type="password" name="Contraseña" id="inputRegPass" required >
                    </label>

                    <label>
                        <span>Comfirmar Contraseña</span>
                        <input type="password" name="Contraseña" id="inputRegPassConfirm" required>
                    </label>
                    <button type="submit">Registrarse</button>
                </form>
                <p class="error-p"></p>
                <a href="#" id="linkToSignIn">no tengo cuenta</a>
            </section>
            <section id="sect-photo">
                <h2>Foto de Perfil</h2>
                <form>
                    <img src="" alt="foto de perfil">
                    <button type="button" id="btnPhoto">Cambiar foto</button>
                    <div>
                        <button type="button">Cancelar</button>
                        <button type="button">Guardar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script src="./index.js"></script>
</body>
</html>
